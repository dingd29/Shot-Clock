[project]
name = "possval"
version = "0.1.0"
description = "Reconstructed shot clock, shot quality, and possession value from NBA play-by-play"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    # Lower bound: scipy>=1.18 uses numpy 2 APIs. Upper bound: numba (via shap) needs <2.5.
    # nba-on-court declares numpy<2 but does not use any removed API, so its pin is ignored.
    "numpy>=2.1,<2.5",
    "requests>=2.31",
    "tqdm>=4.66",
    "nba_api>=1.4",
    "nba-on-court>=0.2.1",
]

[project.optional-dependencies]
models = ["lightgbm>=4.3", "scikit-learn>=1.4", "shap>=0.45"]
app = ["streamlit>=1.40", "plotly>=5.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300 reads pandas boolean masks (`df.CHANCES >= min_chances`) as Yoda conditions and
# wants them reversed, which inverts the natural column-first reading of every filter.
ignore = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
