[project]
name = "possval"
version = "0.1.0"
description = "Reconstructed shot clock, shot quality, and possession value from NBA play-by-play"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "numpy>=1.26",
    "requests>=2.31",
    "tqdm>=4.66",
    "nba_api>=1.4",
]

[project.optional-dependencies]
models = ["lightgbm>=4.3", "scikit-learn>=1.4", "shap>=0.45"]
app = ["streamlit>=1.40", "plotly>=5.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/possval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
